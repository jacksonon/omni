<div id="app" class="app-frame empty-session">
  <aside id="sidebar" class="sidebar" aria-label="工作区与会话">
    <div class="logo-row">
      <button id="btn-new-brand" class="brand" type="button" aria-label="新会话">
        <svg class="brand-fish fish-logo" aria-hidden="true"><use href="#fish-logo"/></svg>
        <span class="brand-name">omni</span>
        <span id="ver" class="build-revision">local</span>
      </button>
      <button id="btn-sidebar-toggle" class="icon-button toggle-sidebar" type="button" title="收起侧栏" aria-label="收起侧栏"><svg><use href="#i-panel-left"/></svg></button>
    </div>
    <button id="btn-new" class="new-session" type="button"><svg><use href="#i-plus"/></svg><span class="new-session-label">新会话</span></button>
    <div class="workspace-region">
      <button class="project-row" id="btn-workspace" type="button" title="当前工作目录（点击切换）"><span class="project-icon"><svg><use href="#i-folder"/></svg></span><span id="workspace-name" class="project-title">当前工作区</span><svg class="project-chevron"><use href="#i-chevron-down"/></svg></button>
      <div class="section-header">
        <span class="section-label">会话</span><span id="session-count" class="session-count">0</span>
        <label class="session-search" title="搜索会话"><svg><use href="#i-search"/></svg><input id="session-search" type="search" placeholder="搜索会话" autocomplete="off"></label>
        <button id="btn-session-add" class="icon-button" type="button" title="新会话" aria-label="新会话"><svg><use href="#i-plus"/></svg></button>
      </div>
      <div id="session-list" class="session-list"></div>
    </div>
    <div class="sidebar-foot">
      <button id="btn-settings" class="settings-button" type="button"><svg><use href="#i-settings"/></svg><span>设置</span></button>
      <div class="connection-line"><span class="status-dot" id="sidebar-status-dot"></span><span id="cwd" title=""></span></div>
    </div>
  </aside>

  <main id="main" class="conversation-shell">
    <header id="chat-header" class="conversation-header">
      <div class="title-row">
        <div class="title-cluster">
          <button id="btn-mobile-sidebar" class="icon-button mobile-only" type="button" title="打开导航" aria-label="打开导航"><svg><use href="#i-menu"/></svg></button>
          <nav class="crumbs" aria-label="会话层级"><button id="chat-title" class="crumb current-crumb" type="button" disabled>新会话</button></nav>
          <span class="header-status"><span class="status-dot" id="status-dot"></span><span id="status-text">就绪</span></span>
        </div>
        <div class="header-actions">
          <button id="btn-header-model" class="model-button" type="button" title="切换模型"><span id="header-model">—</span><svg><use href="#i-chevron-down"/></svg></button>
          <button id="btn-details" class="icon-button" type="button" title="打开详情" aria-label="打开详情"><svg><use href="#i-panel-right"/></svg></button>
        </div>
      </div>
      <nav class="view-tabs" aria-label="会话视图"><button class="view-tab active" data-view="chat" type="button">对话</button><button class="view-tab" data-view="trajectory" type="button">轨迹</button></nav>
    </header>

    <div class="scroll-body">
      <section id="messages" class="messages" aria-live="polite"></section>
      <section id="trajectory-view" class="trajectory-view hidden" aria-label="运行轨迹"></section>
      <footer id="composer-wrap" class="composer-wrap">
        <div class="hero-heading"><svg class="hero-fish fish-logo" aria-hidden="true"><use href="#fish-logo"/></svg><span>探索未至之境</span><span class="preview-badge">预览版</span></div>
        <div class="hero-workspace"><svg><use href="#i-folder"/></svg><span id="hero-workspace-name">当前工作区</span><svg><use href="#i-chevron-down"/></svg></div>
        <div class="hero-glow" aria-hidden="true"></div>
        <div id="interaction-stack"></div>
        <div class="composer-card">
          <textarea id="input" rows="1" placeholder="描述你想要构建的内容" aria-label="消息输入"></textarea>
          <div class="composer-row">
            <div class="composer-tools">
              <button id="btn-attach" class="attach-button" type="button" title="添加上下文" aria-label="添加上下文" disabled><svg><use href="#i-plus"/></svg></button>
              <label class="plan-toggle"><input type="checkbox" id="plan-mode"><span>计划</span></label>
              <button id="btn-composer-settings" class="mode-button" type="button" title="运行设置"><svg><use href="#i-settings"/></svg><span id="composer-mode">标准模式</span></button>
            </div>
            <div class="composer-trailing">
              <button id="composer-model" class="model-select-face" type="button" title="切换模型">—</button>
              <button id="btn-cancel" class="send-button cancel hidden" type="button" title="停止"><svg><use href="#i-square"/></svg></button>
              <button id="btn-send" class="send-button" type="button" title="发送消息"><svg><use href="#i-arrow-up"/></svg></button>
            </div>
          </div>
        </div>
        <div id="composer-note" class="composer-note">选择或新建会话</div>
      </footer>
    </div>
  </main>

  <aside id="details-panel" class="details-panel" aria-label="工具详情">
    <div class="details-head"><div id="details-title" class="details-title">详情</div><button id="btn-close-details" class="icon-button" type="button" title="关闭详情" aria-label="关闭详情"><svg><use href="#i-x"/></svg></button></div>
    <div class="details-body">
      <div id="details-empty" class="details-empty">选择一个工具调用以查看详情。</div>
      <section id="details-input-section" class="details-section hidden"><div class="details-label">输入</div><pre id="details-input" class="details-code"></pre></section>
      <section id="details-output-section" class="details-section hidden"><div class="details-label">输出</div><pre id="details-output" class="details-code"></pre></section>
    </div>
  </aside>
</div>

<div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="modal-card">
    <div class="modal-head"><h2 id="settings-title">设置</h2><button class="icon-button" id="btn-close-settings" type="button" title="关闭" aria-label="关闭"><svg><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <section class="settings-section"><label for="set-model">模型</label><select id="set-model"></select><p>切换后立即用于下一次请求。</p></section>
      <section class="settings-section"><label for="set-apikey">API Key <em>可选</em></label><div class="apikey-row"><input type="password" id="set-apikey" placeholder="沿用当前配置" autocomplete="off"><button id="btn-save-apikey" class="secondary-button" type="button">保存</button></div><p>仅保存在当前进程。</p></section>
      <section class="settings-section"><label for="set-permission">权限级别</label><select id="set-permission"><option value="safe">safe · 危险操作询问</option><option value="full">full · 全量直通</option><option value="ask">ask · 全部询问</option><option value="read">read · 只读</option></select></section>
      <section class="settings-section"><label for="set-effort">思考级别</label><select id="set-effort"></select></section>
      <section class="settings-section"><label for="set-workspace">工作目录</label><div class="apikey-row"><input type="text" id="set-workspace" placeholder="输入绝对路径，如 /Users/me/project" autocomplete="off"><button id="btn-browse-workspace" class="secondary-button" type="button">浏览…</button><button id="btn-change-workspace" class="secondary-button" type="button">切换</button></div><p>切换后新会话将使用该目录作为工作区并记住（下次启动自动应用）；已有会话保留。</p></section>
      <section class="settings-about"><div>工作目录 <code id="about-cwd"></code></div><div>工具 <code id="about-tools"></code></div><div>服务 <code id="about-server"></code></div></section>
    </div>
  </div>
</div>
<div id="dirpicker-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="dirpicker-title">
  <div class="modal-card">
    <div class="modal-head"><h2 id="dirpicker-title">选择工作目录</h2><button class="icon-button" id="btn-close-dirpicker" type="button" title="关闭" aria-label="关闭"><svg><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <div class="dirpicker-path"><code id="dirpicker-current"></code></div>
      <div class="dir-list" id="dirpicker-list"></div>
      <div class="dirpicker-actions">
        <button class="secondary-button" id="btn-dir-up" type="button">上级</button>
        <span class="dirpicker-spacer"></span>
        <button class="secondary-button" id="btn-dir-cancel" type="button">取消</button>
        <button class="primary-button" id="btn-dir-select" type="button">选择此目录</button>
      </div>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
