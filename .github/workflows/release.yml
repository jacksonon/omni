# Release — 打 tag 自动构建并发布
# 触发：推送任意 v* tag → 三平台矩阵构建 → 生成 GitHub Release（tgz + 各平台原生二进制）
#      + npm 自动发布（omnicode 主包 + 5 平台子包，需仓库配置 NPM_TOKEN secret）
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: omni-linux-x64
            musl: '@opentui/core-linux-x64-musl'
            npmPkg: omnicode-linux-x64
            binName: omnicode
          - os: ubuntu-24.04-arm
            artifact: omni-linux-arm64
            musl: '@opentui/core-linux-arm64-musl'
            npmPkg: omnicode-linux-arm64
            binName: omnicode
          - os: macos-15
            artifact: omni-darwin-arm64
            npmPkg: omnicode-darwin-arm64
            binName: omnicode
          - os: macos-15-intel
            artifact: omni-darwin-x64
            npmPkg: omnicode-darwin-x64
            binName: omnicode
          - os: windows-latest
            artifact: omni-win32-x64.exe
            npmPkg: omnicode-win32-x64
            binName: omnicode.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: npm ci

      - name: Install musl variants (linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # bun 静态解析 @opentui/core 的 chunk-bun 按 libc 分支的 import：
          # 需同时提供 gnu + musl 原生包，否则编译报 Could not resolve musl。
          # npm 默认拒绝跨 libc 安装，用 --force --no-save 绕过（不影响 package.json/lock）。
          MUSL_VER=$(node -p "require('./node_modules/@opentui/core/package.json').version")
          npm i --force --no-save "${{ matrix.musl }}@${MUSL_VER}"

      - name: Typecheck + build console bundle (linux-x64 only)
        if: matrix.artifact == 'omni-linux-x64'
        shell: bash
        run: npm run build

      - name: Compile native binary (release/omni)
        shell: bash
        run: npm run compile

      - name: Verify artifact + rename
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=release/omni.exe
          else
            BIN=release/omni
          fi
          test -s "$BIN" && echo "$BIN OK ($(wc -c < "$BIN") bytes)"
          cp "$BIN" "${{ matrix.artifact }}"

      - name: Publish platform package to npm (${{ matrix.npmPkg }})
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 版本与根 package.json 同步（export 后 node -e 才能读到）
          VER=$(node -p "require('./package.json').version")
          export VER
          node -e "const fs=require('fs');const f='packages/npm/${{ matrix.npmPkg }}/package.json';const p=JSON.parse(fs.readFileSync(f));p.version=process.env.VER;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n');" 
          # 二进制入位（bin/ 目录为空目录不入 git，checkout 后需重建）
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=release/omni.exe; else BIN=release/omni; fi
          mkdir -p "packages/npm/${{ matrix.npmPkg }}/bin"
          cp "$BIN" "packages/npm/${{ matrix.npmPkg }}/bin/${{ matrix.binName }}"
          chmod +x "packages/npm/${{ matrix.npmPkg }}/bin/${{ matrix.binName }}"
          cd "packages/npm/${{ matrix.npmPkg }}"
          # 幂等：版本已存在（重复发布/重跑/先手动发过）→ 跳过不失败，避免阻断后续 Release 创建
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$VER" version >/dev/null 2>&1; then
            echo "✔ $PKG_NAME@$VER 已存在，跳过发布"
          else
            npm publish --registry=https://registry.npmjs.org --access public
          fi

      - name: Smoke test published platform package
        shell: bash
        run: |
          # 发布后在隔离前缀安装该平台包并跑一次，
          # 防“bin 缺失/二进制损坏/命名错位”静默发布
          # （平台包走 optionalDependency，装不上 npm 不报错，
          #  用户侧 omni 会以“平台包未安装”暴露）
          # publish 与 install 间隔极短时 registry CDN 未同步会 404（v0.7.13 首跑秒败
          # 的根因）——区分两种失败：安装失败按同步延迟轮询重试（~4 分钟），
          # 安装成功但 bin 缺失/不可执行是真打包缺陷，立即失败并打印目录便于诊断
          VER=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./packages/npm/${{ matrix.npmPkg }}/package.json').name")
          TEST_PREFIX=$(mktemp -d)
          trap 'rm -rf "$TEST_PREFIX"' EXIT
          # 平台包 bin 路径经 npm root 推导（Windows 全局布局无 lib/ 层，不硬编码）
          ROOT="$(npm root -g --prefix "$TEST_PREFIX")"
          STEM="$ROOT/$PKG_NAME/bin/${{ matrix.binName }}"
          # v0.7.18 教训：安装失败输出被吞、统一按 404 重试——若失败原因不是 404
          #（平台不匹配/鉴权/包损坏等），重试 16 次纯属浪费且掩盖根因。现在：非 404
          # 直接打印完整错误退出；404 才按同步延迟重试（registry CDN 曾超过 4 分钟）。
          for i in $(seq 1 24); do
            ERR="$(npm install -g "$PKG_NAME@$VER" --prefix "$TEST_PREFIX" --registry=https://registry.npmjs.org 2>&1)" && {
              if [ -x "$STEM" ]; then
                "$STEM" --version
                exit 0
              fi
              echo "✘ 平台包安装成功但 bin 缺失或不可执行: $STEM"
              ls -la "$ROOT/$PKG_NAME" 2>/dev/null || true
              ls -la "$ROOT/$PKG_NAME/bin" 2>/dev/null || true
              exit 1
            }
            if ! printf '%s' "$ERR" | grep -q "E404\|404 Not Found\|ETARGET"; then
              echo "✘ 安装失败（非 registry 同步问题），直接退出："
              printf '%s\n' "$ERR" | tail -20
              exit 1
            fi
            echo "… registry 未同步（第 $i/24 次），15s 后重试 $PKG_NAME@$VER"
            sleep 15
          done
          echo "✘ 重试超时：registry 上始终取不到 $PKG_NAME@$VER"
          exit 1

      - name: npm pack (omni-<version>.tgz, linux-x64 only)
        if: matrix.artifact == 'omni-linux-x64'
        shell: bash
        run: |
          mkdir -p dist-pkg
          npm pack --pack-destination ./dist-pkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            dist-pkg/*.tgz
          if-no-files-found: ignore

  electron:
    # 桌面应用（Electron）打包：在各自平台构建，产物随 Release 分发
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
            artifact: omni-electron-linux-x64
          - os: macos-15
            target: mac
            arch: arm64
            artifact: omni-electron-darwin-arm64
          - os: macos-15-intel
            target: mac
            arch: x64
            artifact: omni-electron-darwin-x64
          - os: windows-latest
            target: win
            arch: x64
            artifact: omni-electron-win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: npm ci

      - name: Sync + bundle web assets
        run: npm run web:sync && npm run bundle

      - name: Package Electron app (${{ matrix.artifact }})
        shell: bash
        env:
          # Electron/构建工具二进制走镜像（防 GitHub 下载超时；本地 .npmrc 已配置）
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: |
          npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
          ls -la release-electron/

      - name: Collect distributable artifacts
        shell: bash
        run: |
          # 只收集最终可分发的产物（zip/exe/AppImage + 校验文件），
          # 不带整个 app 包目录（asar 关闭后含 node_modules，会拖出数千个源文件）
          mkdir -p dist-desktop
          find release-electron -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.blockmap' -o -name '*.yml' \) -exec cp {} dist-desktop/ \;
          ls -la dist-desktop/

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-desktop
          if-no-files-found: error

  release:
    needs: [build, electron]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Verify artifacts
        run: |
          ls -la ./release-assets

      - name: Publish main package to npm (omni-cli)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 版本 + optionalDependencies 与根 package.json 同步（须在所有平台子包发布成功后）
          VER=$(node -p "require('./package.json').version")
          export VER
          node -e "
            const fs=require('fs');
            const f='packages/npm/omnicode/package.json';
            const p=JSON.parse(fs.readFileSync(f));
            p.version=process.env.VER;
            for (const k of Object.keys(p.optionalDependencies)) p.optionalDependencies[k]=process.env.VER;
            fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n');
          "
          cd packages/npm/omnicode
          # 幂等：版本已存在（重复发布/重跑/先手动发过）→ 跳过不失败，避免阻断后续 Release 创建
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$VER" version >/dev/null 2>&1; then
            echo "✔ $PKG_NAME@$VER 已存在，跳过发布"
          else
            npm publish --registry=https://registry.npmjs.org --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/**
          generate_release_notes: true
